<svg xmlns="http://www.w3.org/2000/svg" width="2376" height="1680" viewBox="0 0 594 420"><rect width="594" height="420" fill="white"/><text x="25" y="75" font-size="5" font-family="Arial,sans-serif" fill="#22313f">TWO FLOORS. ONE COORDINATED DESIGN.</text><text x="25" y="88" font-size="3.2" font-family="Arial,sans-serif" fill="#22313f">Hypothetical Australian commercial office. 30 m x 14 m per floor.</text><text x="25" y="95" font-size="3.2" font-family="Arial,sans-serif" fill="#22313f">840 m2 gross floor area. 400/230 V, 3-phase, 50 Hz.</text><text x="25" y="102" font-size="3.2" font-family="Arial,sans-serif" fill="#22313f">Radial distribution: MSB feeds DB-GF and DB-FF independently.</text><line x1="25" y1="125" x2="240" y2="125" stroke="#22313f" stroke-width="0.25"/><line x1="240" y1="125" x2="240" y2="246" stroke="#22313f" stroke-width="0.25"/><line x1="240" y1="246" x2="25" y2="246" stroke="#22313f" stroke-width="0.25"/><line x1="25" y1="246" x2="25" y2="125" stroke="#22313f" stroke-width="0.25"/><text x="27" y="132.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">DRAWING</text><line x1="52" y1="125" x2="52" y2="246" stroke="#22313f" stroke-width="0.25"/><text x="54" y="132.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">TITLE</text><line x1="175" y1="125" x2="175" y2="246" stroke="#22313f" stroke-width="0.25"/><text x="177" y="132.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">SCALE AT A2</text><line x1="25" y1="136" x2="240" y2="136" stroke="#22313f" stroke-width="0.25"/><text x="27" y="143.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">E-001</text><text x="54" y="143.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">Cover and drawing index</text><text x="177" y="143.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">NTS</text><line x1="25" y1="147" x2="240" y2="147" stroke="#22313f" stroke-width="0.25"/><text x="27" y="154.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">E-002</text><text x="54" y="154.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">Symbols and general notes</text><text x="177" y="154.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">NTS</text><line x1="25" y1="158" x2="240" y2="158" stroke="#22313f" stroke-width="0.25"/><text x="27" y="165.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">E-101</text><text x="54" y="165.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">Ground floor lighting</text><text x="177" y="165.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">1:75</text><line x1="25" y1="169" x2="240" y2="169" stroke="#22313f" stroke-width="0.25"/><text x="27" y="176.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">E-102</text><text x="54" y="176.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">First floor lighting</text><text x="177" y="176.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">1:75</text><line x1="25" y1="180" x2="240" y2="180" stroke="#22313f" stroke-width="0.25"/><text x="27" y="187.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">E-201</text><text x="54" y="187.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">Ground floor power</text><text x="177" y="187.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">1:75</text><line x1="25" y1="191" x2="240" y2="191" stroke="#22313f" stroke-width="0.25"/><text x="27" y="198.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">E-202</text><text x="54" y="198.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">First floor power</text><text x="177" y="198.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">1:75</text><line x1="25" y1="202" x2="240" y2="202" stroke="#22313f" stroke-width="0.25"/><text x="27" y="209.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">E-301</text><text x="54" y="209.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">Emergency lighting and exit signs</text><text x="177" y="209.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">1:125 / NTS</text><line x1="25" y1="213" x2="240" y2="213" stroke="#22313f" stroke-width="0.25"/><text x="27" y="220.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">E-401</text><text x="54" y="220.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">Main single-line diagram</text><text x="177" y="220.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">NTS</text><line x1="25" y1="224" x2="240" y2="224" stroke="#22313f" stroke-width="0.25"/><text x="27" y="231.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">E-501</text><text x="54" y="231.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">Distribution board schedules</text><text x="177" y="231.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">NTS</text><line x1="25" y1="235" x2="240" y2="235" stroke="#22313f" stroke-width="0.25"/><text x="27" y="242.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">E-601</text><text x="54" y="242.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">Cable routing and riser</text><text x="177" y="242.48" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">1:125 / NTS</text><text x="270" y="75" font-size="4" font-family="Arial,sans-serif" fill="#22313f">DESIGN SNAPSHOT</text><text x="270" y="90" font-size="3.3" font-family="Arial,sans-serif" fill="#22313f">Connected load: 75.10 kW</text><text x="270" y="99" font-size="3.3" font-family="Arial,sans-serif" fill="#22313f">Assumed maximum demand: 58.96 kW</text><text x="270" y="108" font-size="3.3" font-family="Arial,sans-serif" fill="#22313f">Conservative apparent demand: 62.93 kVA</text><text x="270" y="117" font-size="3.3" font-family="Arial,sans-serif" fill="#22313f">Balanced 3-phase equivalent: 90.8 A</text><text x="270" y="126" font-size="3.3" font-family="Arial,sans-serif" fill="#22313f">Highest phase demand: 92.0 A</text><text x="270" y="135" font-size="3.3" font-family="Arial,sans-serif" fill="#22313f">Main protective device: 160 A, 3-pole (provisional)</text><text x="270" y="144" font-size="3.3" font-family="Arial,sans-serif" fill="#22313f">Floor feeders: 80 A, 3-pole (provisional)</text><text x="270" y="167" font-size="4" font-family="Arial,sans-serif" fill="#22313f">DELIVERABLES</text><text x="270" y="180" font-size="3" font-family="Arial,sans-serif" fill="#22313f">10 editable DXF drawing sheets with reusable symbols.</text><text x="270" y="188" font-size="3" font-family="Arial,sans-serif" fill="#22313f">Circuit, equipment, cable and load schedules in CSV.</text><text x="270" y="196" font-size="3" font-family="Arial,sans-serif" fill="#22313f">Traceable load, demand, phase and voltage-drop calculations.</text><text x="270" y="204" font-size="3" font-family="Arial,sans-serif" fill="#22313f">Markdown engineering report and assumptions register.</text><text x="270" y="212" font-size="3" font-family="Arial,sans-serif" fill="#22313f">Python generator and source data for repeatable updates.</text><text x="25" y="272" font-size="4" font-family="Arial,sans-serif" fill="#22313f">DESIGN BASIS</text><text x="25" y="285" font-size="3" font-family="Arial,sans-serif" fill="#22313f">A. All loads, equipment and diversity factors are explicitly assumed.</text><text x="25" y="293" font-size="3" font-family="Arial,sans-serif" fill="#22313f">B. Cable sizes and protection are educational proposals, not certified selections.</text><text x="25" y="301" font-size="3" font-family="Arial,sans-serif" fill="#22313f">C. Final design requires current standards, distributor rules and site verification.</text><text x="25" y="309" font-size="3" font-family="Arial,sans-serif" fill="#22313f">D. Self-contained emergency fittings; no central essential-services board in this scope.</text><text x="25" y="317" font-size="3" font-family="Arial,sans-serif" fill="#22313f">E. Fire systems, lift, PV, EV charging, lightning protection and detailed ICT are excluded.</text><text x="25" y="325" font-size="3" font-family="Arial,sans-serif" fill="#22313f">F. General arrangement includes two stairs; fire separation and accessible access are unresolved.</text><text x="25" y="349" font-size="3.5" font-family="Arial,sans-serif" fill="#22313f">READ FIRST</text><text x="25" y="359" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">Start with docs/engineering-report.md and docs/design-assumptions.md.</text><text x="25" y="365" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">Use E-002 for symbols and E-501 with the CSV schedules for full circuit details.</text><line x1="10" y1="10" x2="584" y2="10" stroke="#22313f" stroke-width="0.25"/><line x1="584" y1="10" x2="584" y2="410" stroke="#22313f" stroke-width="0.25"/><line x1="584" y1="410" x2="10" y2="410" stroke="#22313f" stroke-width="0.25"/><line x1="10" y1="410" x2="10" y2="10" stroke="#22313f" stroke-width="0.25"/><line x1="10" y1="48" x2="584" y2="48" stroke="#22313f" stroke-width="0.25"/><text x="20" y="26" font-size="6" font-family="Arial,sans-serif" fill="#22313f">NORTHBANK OFFICE</text><text x="20" y="39" font-size="4" font-family="Arial,sans-serif" fill="#22313f">COVER AND DRAWING INDEX</text><text x="456" y="25" font-size="3" font-family="Arial,sans-serif" fill="#22313f">ELECTRICAL PORTFOLIO</text><text x="456" y="34" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">CONCEPT DESIGN  /  REV A</text><text x="456" y="42" font-size="2.5" font-family="Arial,sans-serif" fill="#22313f">NOT FOR CONSTRUCTION</text><line x1="10" y1="382" x2="584" y2="382" stroke="#22313f" stroke-width="0.25"/><line x1="345" y1="382" x2="345" y2="410" stroke="#22313f" stroke-width="0.25"/><line x1="480" y1="382" x2="480" y2="410" stroke="#22313f" stroke-width="0.25"/><text x="18" y="391" font-size="3.1" font-family="Arial,sans-serif" fill="#22313f">Two-Storey Commercial Office Electrical Design</text><text x="18" y="398" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">Designed by: Electrical Engineering Portfolio Project</text><text x="18" y="405" font-size="2.3" font-family="Arial,sans-serif" fill="#22313f">Educational exercise; not for construction, certification or regulatory approval.</text><text x="353" y="391" font-size="2.5" font-family="Arial,sans-serif" fill="#22313f">E-001  |  Cover and drawing index</text><text x="353" y="399" font-size="2.5" font-family="Arial,sans-serif" fill="#22313f">Scale: NTS at A2  |  Units: mm</text><text x="488" y="391" font-size="3" font-family="Arial,sans-serif" fill="#22313f">REV A</text><text x="488" y="399" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">2026-09-29</text><text x="488" y="406" font-size="2.3" font-family="Arial,sans-serif" fill="#22313f">Sheet size: 594 x 420 mm</text></svg>