="#22313f">05  Equipment AC-GF-01 is served by circuit GF-AC01.</text><text x="302" y="130" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">06  Nxxx, SOxxx and Exxx take the floor prefix shown on the sheet.</text><text x="302" y="138" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">07  DB-GF and DB-FF are parallel radial feeders from MSB.</text><text x="302" y="146" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">08  Separate neutral and PE downstream of the main MEN point.</text><text x="302" y="154" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">09  RCD type and compatibility depend on actual equipment.</text><text x="302" y="162" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">10  Lighting target: 400 lx office tasks; ancillary targets are assumed.</text><text x="302" y="170" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">11  Emergency layout requires photometric / egress verification.</text><text x="302" y="178" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">12  Maintain unswitched supply sensing to local emergency fittings.</text><text x="302" y="186" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">13  No power-factor correction, harmonic or fault study completed.</text><text x="302" y="194" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">14  Paper-space geometry: plans drawn at stated scale in model space.</text><text x="302" y="202" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">     Multiply measured plan lengths by 75 or 125 for real mm.</text><text x="302" y="210" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">15  Symbols are project conventions; not claimed as standard symbols.</text><text x="302" y="229" font-size="4" font-family="Arial,sans-serif" fill="#22313f">CAD LAYERS</text><text x="302" y="241" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ARCH-WALLS</text><text x="302" y="247" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ARCH-DOORS</text><text x="302" y="253" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ARCH-TEXT</text><text x="302" y="259" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ARCH-FURNITURE</text><text x="302" y="265" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-LIGHT</text><text x="302" y="271" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-EMERGENCY</text><text x="302" y="277" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-SWITCH</text><text x="302" y="283" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-POWER</text><text x="302" y="289" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-DEDICATED</text><text x="302" y="295" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-DB</text><text x="302" y="301" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-CABLE</text><text x="302" y="307" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-SLD</text><text x="302" y="313" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-SYMBOLS</text><text x="302" y="319" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-TEXT</text><text x="302" y="325" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-LIGHT-TEXT</text><text x="302" y="331" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">ELEC-DIMENSIONS</text><text x="302" y="337" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">SHEET</text><line x1="10" y1="10" x2="584" y2="10" stroke="#22313f" stroke-width="0.25"/><line x1="584" y1="10" x2="584" y2="410" stroke="#22313f" stroke-width="0.25"/><line x1="584" y1="410" x2="10" y2="410" stroke="#22313f" stroke-width="0.25"/><line x1="10" y1="410" x2="10" y2="10" stroke="#22313f" stroke-width="0.25"/><line x1="10" y1="48" x2="584" y2="48" stroke="#22313f" stroke-width="0.25"/><