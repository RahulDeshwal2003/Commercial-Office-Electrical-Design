fill="#22313f">PE feeders to DBs; separate N and PE bars downstream.</text><text x="330" y="106" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">No downstream N-PE links. Earthing sizes unverified.</text><text x="330" y="112" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">Final distributor arrangement and fault-loop design required.</text><text x="25" y="344" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">Protection values are provisional. Breaker curves, fault rating and discrimination require a fault-level / coordination study.</text><text x="25" y="351" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">30 mA Type A RCBO concept for lighting and socket/appliance final circuits; HVAC/UPS RCD compatibility requires manufacturer review.</text><text x="25" y="358" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">No separate mechanical board for four small packaged HVAC units. Self-contained emergency luminaires have no central essential supply.</text><text x="25" y="365" font-size="2.6" font-family="Arial,sans-serif" fill="#22313f">UPS-01 output feeds SERVER-01 (1.8 kW) and protected ICT (0.2 kW); 2.2 kW input allowance includes losses. Do not add output loads again.</text><line x1="10" y1="10" x2="584" y2="10" stroke="#22313f" stroke-width="0.25"/><line x1="584" y1="10" x2="584" y2="410" stroke="#22313f" stroke-width="0.25"/><line x1="584" y1="410" x2="10" y2="410" stroke="#22313f" stroke-width="0.25"/><line x1="10" y1="410" x2="10" y2="10" stroke="#22313f" stroke-width="0.25"/><line x1="10" y1="48" x2="584" y2="48" stroke="#22313f" stroke-width="0.25"/><text x="20" y="26" font-size="6" font-family="Arial,sans-serif" fill="#22313f">NORTHBANK OFFICE</text><text x="20" y="39" font-size="4" font-family="Arial,sans-serif" fill="#22313f">MAIN SINGLE-LINE DIAGRAM</text><text x="456" y="25" font-size="3" font-family="Arial,sans-serif" fill="#22313f">ELECTRICAL PORTFOLIO</text><text x="456" y="34" font-size="2.8" font-family="Arial,sans-serif" fill="#22313f">CONCEPT DESIGN  /  REV A</text><text x="456" y="42" font-size="2.5" font-family="Arial,sans-serif" fill="#22313f">NOT FOR CONSTRUCTION</text><line x1="10" y1="382" x2="584" y2="382" stroke="#22313f" stroke-width="0.25"/><line x1="345" y1="382" x2="345" y2="410" stroke="#22313f" stroke-width="0.25"/><line x1="480" y1="382" x2="480" y2="410" stroke="#22313f" stroke-width="0.25"/><text x="18" y="391" font-size="3.1" font-family="Arial,sans-serif" fill="#22313f">Two-Storey Commercial Office Electrical Design</text><text x="18" y="398" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">Designed by: Electrical Engineering Portfolio Project</text><text x="18" y="405" font-size="2.3" font-family="Arial,sans-serif" fill="#22313f">Educational exercise; not for construction, certification or regulatory approval.</text><text x="353" y="391" font-size="2.5" font-family="Arial,sans-serif" fill="#22313f">E-401  |  Main single-line diagram</text><text x="353" y="399" font-size="2.5" font-family="Arial,sans-serif" fill="#22313f">Scale: NTS at A2  |  Units: mm</text><text x="488" y="391" font-size="3" font-family="Arial,sans-serif" fill="#22313f">REV A</text><text x="488" y="399" font-size="2.7" font-family="Arial,sans-serif" fill="#22313f">2026-09-29</text><text x="488" y="406" font-size="2.3" font-family="Arial,sans-serif" fill="#22313f">Sheet size: 594 x 420 mm</text></svg>